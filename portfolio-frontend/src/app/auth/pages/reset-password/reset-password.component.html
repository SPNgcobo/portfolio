<div class="reset-container">
    <div class="reset-card">
        <h2>Create New Password</h2>
        <p class="subtitle">Enter your new password below</p>

        <div class="success-message" *ngIf="successMessage">
            {{ successMessage }}
        </div>

        <div class="error-message" *ngIf="errorMessage">
            {{ errorMessage }}
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" formControlName="password" placeholder="••••••••"
                    [class.error]="form.get('password')?.invalid && form.get('password')?.touched" />
                <small class="error-text" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
                    Password must be at least 6 characters
                </small>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" formControlName="confirmPassword" placeholder="••••••••"
                    [class.error]="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched" />
                <small class="error-text"
                    *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
                    Passwords do not match
                </small>
            </div>

            <button type="submit" [disabled]="loading || form.invalid">
                {{ loading ? 'Resetting...' : 'Reset Password' }}
            </button>

            <div class="links">
                <a routerLink="/login">Back to Login</a>
            </div>
        </form>

        <div class="links" *ngIf="successMessage">
            <a routerLink="/login">Go to Login</a>
        </div>
    </div>
</div>
