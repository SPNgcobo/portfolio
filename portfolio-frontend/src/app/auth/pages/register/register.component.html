<div class="register-container">
    <div class="register-card">
        <h2>Create Account</h2>
        <p class="subtitle">Join the portfolio community</p>

        <div class="success-message" *ngIf="successMessage">
            {{ successMessage }}
        </div>

        <form [formGroup]="form" (ngSubmit)="register()">
            <div class="form-group">
                <label>Username</label>
                <input type="text" formControlName="username" placeholder="johndoe"
                    [class.error]="form.get('username')?.invalid && form.get('username')?.touched" />
                <small class="error-text" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
                    Username must be at least 3 characters
                </small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="you@example.com"
                    [class.error]="form.get('email')?.invalid && form.get('email')?.touched" />
                <small class="error-text" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
                    Valid email is required
                </small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" formControlName="password" placeholder="••••••••"
                    [class.error]="form.get('password')?.invalid && form.get('password')?.touched" />
                <small class="error-text" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
                    Password must be at least 6 characters
                </small>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" formControlName="confirmPassword" placeholder="••••••••"
                    [class.error]="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched" />
                <small class="error-text"
                    *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
                    Passwords do not match
                </small>
            </div>

            <div class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <button type="submit" [disabled]="loading || form.invalid">
                {{ loading ? 'Creating account...' : 'Sign Up' }}
            </button>

            <div class="links">
                <a routerLink="/login">Already have an account? Sign in</a>
            </div>
        </form>
    </div>
</div>
