<section class="projects">

    <h2>My Projects</h2>

    <div *ngIf="loading" class="loading">
        Loading projects...
    </div>

    <div *ngIf="!loading && projects.length === 0" class="loading">
        No projects found.
    </div>

    <div class="projects-grid" *ngIf="!loading && projects.length > 0" [@listAnimation]>

        <div class="project-card" *ngFor="let project of projects">

            <div class="image-container">
                <img [src]="project.images?.[0] || 'https://via.placeholder.com/400x220'"
                    [alt]="project.title || 'project image'" />
            </div>

            <h3>{{ project.title || 'Untitled Project' }}</h3>

            <p>
                {{ project.description || 'No description available' }}
            </p>

            <div class="tech" *ngIf="project.techStack?.length">
                <span *ngFor="let t of project.techStack">
                    {{ t }}
                </span>
            </div>

            <div class="actions">

                <a *ngIf="project.githubVisible && project.github" [href]="project.github" target="_blank">
                    GitHub
                </a>

                <a *ngIf="project.liveDemo" [href]="project.liveDemo" target="_blank">
                    Live Demo
                </a>

                <a *ngIf="project.id" [routerLink]="['/projects', project.id]">
                    View Details
                </a>

            </div>

        </div>

    </div>

</section>
